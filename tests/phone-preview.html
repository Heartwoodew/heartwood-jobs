{

<body>
<header class="top">
  <div class="brand"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><g fill="#e7c59a"><rect x="13" y="2" width="6" height="12" rx="3"/><rect x="13" y="18" width="6" height="12" rx="3"/><rect x="2" y="13" width="12" height="6" rx="3"/><rect x="18" y="13" width="12" height="6" rx="3"/></g></svg>Heartwood <span>Jobs</span></div>
  <div class="gsearch hidden" id="gsw"><input id="gq" type="search" placeholder="Search lot, street, PO or job #" autocomplete="off" aria-label="Search jobs"><div id="gres" class="gres hidden"></div></div>

</header>
<main id="app"><p class="muted pad">Loading…</p></main>
<dialog id="dlg"></dialog>
<div id="toast" class="toast hidden"></div>
<script>
  const q = new URLSearchParams(location.search);
  window.HW_TODAY = "2026-11-06";
  window.HW_PREVIEW_ROLE = q.get("role") || "operator";
  window.HW_CHAT = {
    staff: [
      { id: "m1", senderUid: "sam", senderName: "Sam", text: "Brightvale slab is clear. The crew can start.", createdAt: "2026-11-06T07:05:00+10:00" },
      { id: "m2", senderUid: "patrick", senderName: "Patrick", text: "Thanks. I'm on site now.", createdAt: "2026-11-06T07:12:00+10:00" },
      { id: "m3", senderUid: "sam", senderName: "Sam", text: "Gate's open. Photo of the edge is below.", createdAt: "2026-11-06T07:18:00+10:00", photoPath: "tenants/heartwood/chat/staff/photos/csitephoto1", photoType: "image/jpeg" },
      { id: "m4", senderUid: "patrick", senderName: "Patrick", text: "Got it. I'll send the office a note when the backblade is done.", createdAt: "2026-11-06T07:24:00+10:00" },
      { id: "m5", senderUid: "sam", senderName: "Sam", text: "Next one is Cedar Court this afternoon.", createdAt: "2026-11-06T07:31:00+10:00" },
      { id: "m6", senderUid: "patrick", senderName: "Patrick", text: "See you there.", createdAt: "2026-11-06T07:36:00+10:00" }
    ],
    job_j2: [
      { id: "j2m1", senderUid: "sam", senderName: "Sam", text: "Slab edge is clean. Road base is on the truck.", createdAt: "2026-11-06T08:02:00+10:00" },
      { id: "j2m2", senderUid: "patrick", senderName: "Patrick", text: "Starting the backblade after this photo.", createdAt: "2026-11-06T08:10:00+10:00", photoPath: "tenants/heartwood/chat/jobs/j2/photos/cjobphoto01", photoType: "image/jpeg" }
    ]
  };
  window.HW_PREVIEW_RATES = q.get("rates") || "";
  window.__errs = [];
  window.addEventListener("error", e => window.__errs.push(String(e.message || e.error)));
  window.addEventListener("unhandledrejection", e => window.__errs.push(String(e.reason && (e.reason.stack || e.reason.message || e.reason))));
  const origClick = HTMLInputElement.prototype.click;
  HTMLInputElement.prototype.click = function () {
    if (this.type === "file") { window.__photoClicks = (window.__photoClicks || 0) + 1; return; }
    return origClick.apply(this, arguments);
  };
</script>
<script type="module" src="../app/app.js"></script>
<script type="module">
const q = new URLSearchParams(location.search);
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function waitFor(sel, ms = 4000) {
  const t0 = performance.now();
  while (performance.now() - t0 < ms) {
    if (document.querySelector(sel)) return document.querySelector(sel);
    await sleep(30);
  }
  return null;
}
if (q.get("photos") === "error") window.HW_STORAGE_LIST_ERROR = "1";
if (q.get("photos") !== "none" && q.get("photos") !== "error") {
  const jpeg = async (label, color) => {
    const c = document.createElement("canvas");
    c.width = 640; c.height = 480;
    const g = c.getContext("2d");
    g.fillStyle = color; g.fillRect(0, 0, 640, 480);
    g.strokeStyle = "#3b2a1a"; g.lineWidth = 16; g.strokeRect(28, 28, 584, 424);
    g.fillStyle = "#3b2a1a"; g.font = "bold 64px system-ui, sans-serif"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(label, 320, 240);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.86));
    return new Uint8Array(await blob.arrayBuffer());
  };
  const site = await jpeg("Site", "#e7c59a");
  const crew = await jpeg("Crew", "#f6f1ea");
  const slip = await jpeg("Receipt", "#d8c3a5");
  const meta = (purpose, extra) => ({ purpose, tenantId: "heartwood", jobId: "j2", uploaderUid: "patrick", batchCount: "1", expiresAfter: "2099-01-01", ...extra });
  window.HW_STORAGE_OBJECTS = [
    { path: "tenants/heartwood/jobs/j2/photos/psite", contentType: "image/jpeg", size: site.length, bytes: site, timeCreated: "2026-11-06T01:00:00.000Z", customMetadata: meta("job-photo") },
    { path: "tenants/heartwood/jobs/j2/photos/pcrew", contentType: "image/jpeg", size: crew.length, bytes: crew, timeCreated: "2026-11-06T00:30:00.000Z", customMetadata: meta("job-photo") },
    { path: "tenants/heartwood/jobs/j2/photos/rsecret", contentType: "image/jpeg", size: slip.length, bytes: slip, timeCreated: "2026-11-06T03:00:00.000Z", customMetadata: meta("receipt", { receiptId: "r1" }) },
    { path: "tenants/heartwood/receipts/r1/original", contentType: "image/jpeg", size: slip.length, bytes: slip, timeCreated: "2026-11-06T03:00:00.000Z", customMetadata: meta("receipt", { receiptId: "r1" }) }
  ];
}
const JOB674 = "sm8_01a0e504-b690-794e-a99e-374ec5ab19ab_202611060900";
if (q.get("cloud") === "4") {
  const jpeg = async (label, color) => {
    const c = document.createElement("canvas");
    c.width = 320; c.height = 240;
    const g = c.getContext("2d");
    g.fillStyle = color; g.fillRect(0, 0, 320, 240);
    g.fillStyle = "#3b2a1a"; g.font = "bold 42px system-ui, sans-serif"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(label, 160, 120);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.86));
    return new Uint8Array(await blob.arrayBuffer());
  };
  const colors = ["#e7c59a", "#f6f1ea", "#efe6da", "#d8c3a5"];
  const files = [];
  for (let i = 1; i <= 4; i++) {
    const bytes = await jpeg(String(i), colors[i - 1]);
    files.push({
      path: `tenants/heartwood/jobs/${JOB674}/photos/p${i}`,
      contentType: "image/jpeg", size: bytes.length, bytes,
      timeCreated: `2026-11-06T0${i}:00:00.000Z`,
      customMetadata: { purpose: "job-photo", tenantId: "heartwood", jobId: JOB674, uploaderUid: "patrick", batchCount: "4", expiresAfter: "2027-02-06" }
    });
  }
  const slip = await jpeg("Receipt", "#c4b4a4");
  files.push({
    path: "tenants/heartwood/receipts/r674/original",
    contentType: "image/jpeg", size: slip.length, bytes: slip,
    customMetadata: { purpose: "receipt", receiptId: "r674", tenantId: "heartwood" }
  });
  window.HW_STORAGE_OBJECTS = files;
}
await waitFor(".mob, .sm-layout, #login");
await sleep(80);
async function openJob(id) {
  document.querySelector(`.mrow[data-id="${id}"], .hrow[data-id="${id}"]`)?.click();
  await waitFor(`[data-photoslot="${id}"][data-settled="1"], [data-photos-state="error"]`, 4000);
}
if (q.get("open") === "detail" || q.get("open") === "gallery") await openJob("j2");
if (q.get("open") === "job") {
  document.querySelector('[data-tab="week"]')?.click();
  await sleep(40);
  await openJob(q.get("job") || "j4");
}
if (q.get("open") === "gallery" || q.get("view") === "large") {
  document.querySelector("[data-viewphotos]")?.click();
  await waitFor(".pgal .pth img, .pgal [data-photos-state='error']", 4000);
}
if (q.get("view") === "large") {
  document.querySelector(".pgal button.pth")?.click();
  await waitFor(".pview img", 4000);
}
if (q.get("open") === "jobs") document.querySelector('[data-tab="week"]')?.click();
if (q.get("open") === "photos") {
  document.querySelector('[data-tab="photos"]')?.click();
  await waitFor('[data-photoslot][data-settled="1"]', 4000);
}
if (q.get("open") === "job" && q.get("photos") === "none") {
  await waitFor("[data-viewphotos]");
  document.querySelector("[data-viewphotos]")?.click();
  await waitFor(".pgal [data-photos-state='empty']", 4000);
}
if (q.get("open") === "job674") {
  await waitFor(`[data-id="${JOB674}"]`, 6000);
  document.querySelector(`[data-id="${JOB674}"]`)?.click();
  await waitFor("#emailph", 6000);
  document.querySelector('[data-jt="photos"]')?.click();
  await waitFor("[data-viewphotos]", 4000);
  if (q.get("shot")) {
    document.querySelector(`[data-photoslot="${JOB674}"] [data-viewphotos]`)?.click();
    await waitFor(".pgal [data-photos-state], .pgal .pth img", 4000);
  }
}
if (q.get("open") === "jobphotos") {
  await waitFor("[data-id='j2']", 6000);
  document.querySelector("[data-id='j2']")?.click();
  await waitFor("#emailph", 6000);
  document.querySelector('[data-jt="photos"]')?.click();
  await waitFor("[data-viewphotos]", 4000);
  if (q.get("shot") === "empty" || q.get("shot") === "gallery") {
    document.querySelector("[data-viewphotos]")?.click();
    await waitFor(".pgal [data-photos-state], .pgal .pth img", 4000);
  }
}
if (q.get("open") === "chat") {
  document.querySelector('[data-tab="chat"]')?.click();
  await waitFor(".chat-log .chat-msg", 4000);
  await waitFor(".chat-pic img", 4000);
}
if (q.get("open") === "jobchat") {
  await openJob("j2");
  document.querySelector('[data-jtab="chat"]')?.click();
  await waitFor(".job-chat .chat-msg", 4000);
}
if (q.get("open") === "more") document.querySelector('[data-tab="more"]')?.click();
if (q.get("open") === "myjobs") document.querySelector('[data-view="myjobs"]')?.click();
if (q.get("open") === "quotes") {
  document.querySelector('[data-tab="more"]')?.click();
  await sleep(40);
  document.querySelector('[data-go="quotes"]')?.click();
  await waitFor("#newquote");
}
if (q.get("open") === "wizard") {
  document.querySelector('[data-tab="more"]')?.click();
  await sleep(30);
  document.querySelector('[data-go="quotes"]')?.click();
  await waitFor("#newquote");
  document.querySelector("#newquote")?.click();
  await waitFor("#qwf", 4000);
}
if (q.get("check") === "1") {
  const fails = [];
  const ok = (cond, msg) => { if (!cond) fails.push(msg); };
  const text = () => document.body.innerText;
  const role = window.HW_PREVIEW_ROLE;
  if (role === "operator") {
    ok(!!document.querySelector(".mob"), "operator shell");
    const labels = [...document.querySelectorAll(".mob-tabs button")].map(b => b.textContent.replace(/\s+/g, " ").trim());
    ok(labels.join("|") === "Today|Jobs|Photos|More" || labels.join(" ").includes("Today") && labels.join(" ").includes("Jobs") && labels.join(" ").includes("Photos") && labels.join(" ").includes("More"), "tabs " + labels.join(","));
    ok(!document.querySelector('[data-go="quotes"]') && !text().includes("Quote rates"), "operator has no quotes");
    ok(!/\$\s?\d/.test(text()), "operator has no dollar amounts: " + text().slice(0, 240));
    document.querySelector('[data-tab="week"]')?.click();
    await sleep(40);
    ok(document.querySelector(".mob-tabs button.on")?.textContent.includes("Jobs"), "jobs tab");
    ok(!/\$\s?\d/.test(text()), "jobs tab dollars");
    document.querySelector('[data-tab="photos"]')?.click();
    await sleep(40);
    ok(!!document.querySelector("[data-photo], .op-photo"), "photos action");
    document.querySelector("[data-photo]")?.click();
    await sleep(20);
    ok((window.__photoClicks || 0) >= 1, "add photos calls existing email picker");
    document.querySelector('[data-tab="more"]')?.click();
    await sleep(40);
    ok(!!document.querySelector('[data-go="hours"]'), "hours");
    ok(!!document.querySelector('[data-go="done"]'), "completed");
    ok(!!document.querySelector('[data-go="swms"]'), "swms");
    ok(!!document.querySelector('[data-inc]'), "incident");
    ok(!document.querySelector('[data-go="quotes"]'), "more hides quotes");
    ok(!/\$\s?\d/.test(text()), "more dollars");
    document.querySelector('[data-tab="today"]')?.click();
    await sleep(40);
    const card = document.querySelector('.mrow[data-id="j2"]');
    ok(!!card, "today card");
    card?.click();
    await sleep(40);
    ok(!!document.querySelector("#back"), "back");
    ok(!!document.querySelector('#emailph'), "emailph");
    ok(!!document.querySelector('[data-act="start"]'), "start");
    ok(!!document.querySelector('[data-act="done"]'), "complete");
    ok(!!document.querySelector('[data-act="note"]'), "note");
    const dir = document.querySelector('a[href*="maps"]');
    ok(!!dir && /Brightvale/.test(decodeURIComponent(dir.getAttribute("href"))), "directions");
    ok(!/\$\s?\d/.test(text()), "detail dollars");
    await waitFor('[data-photoslot][data-settled="1"]');
    const photosBtn = document.querySelector("[data-viewphotos]");
    ok(!!photosBtn && /View cloud photos/.test(photosBtn.textContent), "photos action when cloud photos exist");
    const writes = () => (window.__fbCalls || []).filter(c => c.op === "updateDoc" || c.op === "setDoc" || c.op === "uploadBytes");
    const beforeWrites = writes().length;
    const beforePicker = window.__photoClicks || 0;
    photosBtn.click();
    await waitFor(".pgal button.pth img");
    ok(document.querySelectorAll(".pgal button.pth").length === 2, "two job photos and the receipt image stays hidden");
    const gtext = document.querySelector(".pgal")?.innerText || "";
    ok(gtext.includes("2027-02-06"), "operational expiry from the job date, not the stored 2099 stamp: " + gtext.slice(0, 280));
    ok(/not scheduled/i.test(gtext), "deletion is not scheduled");
    ok(/does not change that date/i.test(gtext), "opening photos does not move the date");
    ok(!gtext.includes("2099"), "gallery ignores a stored expiresAfter that would reset the clock");
    ok(!document.querySelector(".pgal [data-cloudexport]"), "operator does not get the admin cloud download");
    ok(!/\$\s?\d/.test(gtext), "gallery has no dollar amounts");
    document.querySelector(".pgal button.pth").click();
    await waitFor(".pview img");
    ok(!!document.querySelector(".pview img"), "larger photo");
    document.querySelector(".pview .px")?.click();
    document.querySelector(".pgal-x")?.click();
    await sleep(20);
    ok(document.getElementById("pgal")?.hidden === true, "gallery closes");
    ok((window.__photoClicks || 0) === beforePicker, "viewing does not open the email picker");
    ok(writes().length === beforeWrites, "viewing does not write the job or storage");
    document.querySelector('[data-act="start"]')?.click();
    await sleep(30);
    ok((window.__fbCalls || []).some(c => c.op === "updateDoc" && c.status === "In progress"), "start uses updateDoc");
    document.querySelector('[data-act="note"]')?.click();
    await sleep(20);
    ok(!!document.querySelector("#of textarea[name=note]"), "note dialog");
    document.querySelector("#dlg")?.close();
    const before = window.__photoClicks || 0;
    document.querySelector("#emailph")?.click();
    await sleep(20);
    ok((window.__photoClicks || 0) > before, "detail add photos");
    document.querySelector("#back")?.click();
    await sleep(30);
    ok(!!document.querySelector('.mrow[data-id="j2"]'), "back to list");
  }
  if (role === "admin") {
    ok(!!document.querySelector('[data-view="quotes"]'), "admin quotes nav");
    ok(!document.querySelector(".mob-tabs"), "admin home is not the phone shell");
    document.querySelector('[data-view="quotes"]')?.click();
    await waitFor("#editrates");
    ok(!!document.querySelector("#editrates"), "only admin edits rates");
    ok(!!document.querySelector("#newquote"), "admin new quote");
    document.querySelector('[data-view="myjobs"]')?.click();
    await sleep(50);
    ok(!!document.querySelector("#toadmin"), "back to admin");
    document.querySelector('[data-tab="more"]')?.click();
    await sleep(30);
    ok(!document.querySelector('[data-go="quotes"]'), "admin quotes stay on the admin screen");
  }
  if (role === "supervisor" && window.HW_PREVIEW_RATES === "blank") {
    document.querySelector('[data-tab="more"]')?.click();
    await sleep(30);
    document.querySelector('[data-go="quotes"]')?.click();
    await waitFor("#newquote");
    document.querySelector("#newquote").click();
    await waitFor("#qwf");
    const addr = document.querySelector("[name=address]");
    if (addr) addr.value = "1 Test Street, Chuwar QLD 4306";
    const hours = document.querySelector("[name=hoursOnSite]");
    if (hours) hours.value = "2";
    document.querySelector("#qwnext")?.click();
    await sleep(40);
    const preset = document.querySelector('[name=preset][value=truck]');
    if (preset) { preset.checked = true; preset.dispatchEvent(new Event("change")); }
    await sleep(30);
    document.querySelector("#qwnext")?.click();
    await sleep(40);
    const accept = document.querySelector("#qwaccept");
    const review = document.querySelector("#qwf")?.innerText || "";
    ok(accept && accept.disabled, "missing rates block accept");
    ok(/Missing rates|rate missing|Incomplete/i.test(review), "missing rate is visible");
    ok(/Incomplete/.test(review), "blank rates are not turned into a total");
  }
  if (role === "supervisor" && window.HW_PREVIEW_RATES !== "blank") {
    document.querySelector('[data-tab="more"]')?.click();
    await sleep(30);
    ok(!!document.querySelector('[data-go="quotes"]'), "supervisor quotes");
    ok(!document.querySelector("#editrates"), "supervisor cannot edit rates from more");
    document.querySelector('[data-go="quotes"]')?.click();
    await waitFor("#newquote");
    ok(!!document.querySelector("#newquote"), "new quote");
    ok(!document.querySelector("#editrates"), "no rate editor");
    document.querySelector("#newquote").click();
    await waitFor("#qwf");
    const wiz = document.querySelector("#qwf")?.innerText || "";
    ok(/Job/.test(wiz) && /Setup/.test(wiz) && /Review/.test(wiz), "three steps");
    ok(!/Step 4/.test(wiz), "not seven steps");
    document.querySelector("[data-type=backslab]")?.click();
    await sleep(30);
    const hours = document.querySelector("[name=hoursOnSite]");
    if (hours) { hours.value = "4"; hours.dispatchEvent(new Event("input")); }
    const addr = document.querySelector("[name=address]");
    if (addr && !addr.value) addr.value = "Lot 88 · 14 Brightvale Street, Redbank Plains QLD 4301";
    document.querySelector("#qwnext")?.click();
    await sleep(40);
    const preset = document.querySelector('[name=preset][value=truck_skid]');
    ok(!!preset, "truck+skid preset");
    if (preset) { preset.checked = true; preset.dispatchEvent(new Event("change")); }
    await sleep(40);
    ok(document.querySelector("#qlabourer"), "labourer control");
    document.querySelector('[data-lab="no"]')?.click();
    await sleep(30);
    document.querySelector("#qwnext")?.click();
    await sleep(40);
    const review = document.querySelector("#qwf")?.innerText || "";
    const truckLines = (review.match(/Truck \+ operator/g) || []).length;
    ok(truckLines === 1, "truck billed once, got " + truckLines + " :: " + review.slice(0, 500));
    ok(/Skid steer/.test(review), "skid line");
    ok(/\$/.test(review), "supervisor sees totals");
    ok(document.querySelector("#qwaccept") && !document.querySelector("#qwaccept").disabled, "accept enabled when rates exist");
  }
  document.body.dataset.check = fails.length ? "fail" : "pass";
  document.body.dataset.fails = fails.join(" | ");
}
document.body.dataset.ready = "1";
const pre = document.createElement("pre");
pre.id = "probe";
pre.textContent = JSON.stringify({ ready: true, role: window.HW_PREVIEW_ROLE, errs: window.__errs, check: document.body.dataset.check || "", fails: document.body.dataset.fails || "" });
document.body.appendChild(pre);
</script>
</body>
</html>
