<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Helper preview</title>
<link rel="stylesheet" href="../app/styles.css">
</head>
<body class="operator">
<header class="top">
  <div class="brand"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><g fill="#e7c59a"><rect x="13" y="2" width="6" height="12" rx="3"/><rect x="13" y="18" width="6" height="12" rx="3"/><rect x="2" y="13" width="12" height="6" rx="3"/><rect x="18" y="13" width="12" height="6" rx="3"/></g></svg>Heartwood <span>Jobs</span></div>
  <div class="who">Sam · operator</div>
</header>
<main>
  <div class="mob">
    <div class="mob-intro">
      <div class="mob-kicker">Sunday 8 November</div>
      <h2 class="mob-hello">G'day Sam</h2>
      <p class="mob-count">1 job today</p>
    </div>
    <div class="mrow opj" data-demo-job="iron">
      <div class="mtime"><b>7:00 am</b></div>
      <div class="mcl">Spoil removal</div>
      <div class="maddr">12 Ironbark Street</div>
      <div class="mdesc">Orbit Homes · Wednesday 12 November</div>
      <div class="mst">Sam · #441</div>
    </div>
  </div>
  <nav class="mob-tabs" aria-label="Sections">
    <button type="button" class="on">Today</button>
    <button type="button">Jobs</button>
    <button type="button">Chat</button>
    <button type="button">Photos</button>
    <button type="button">More</button>
  </nav>
</main>
<div id="helper-root"></div>
<script>
window.__voices = [];
window.__synth = {
  calls: [],
  cancelled: 0,
  getVoices() { return window.__voices; },
  speak(utter) { this.calls.push({ lang: utter.lang, voiceLang: utter.voice && utter.voice.lang, text: utter.text }); },
  cancel() { this.cancelled += 1; },
  addEventListener() {},
};
</script>
<script type="module">
import { mountHelper } from "../app/features/helper.js";
const params = new URLSearchParams(location.search);
if (params.get("voice") === "au") window.__voices = [{ name: "Karen", lang: "en-AU" }];
if (params.get("voice") === "other") window.__voices = [{ name: "Australian English", lang: "en-GB" }];
const root = document.getElementById("helper-root");
class FakeUtterance { constructor(text) { this.text = text; } }
window.__writes = 0;
mountHelper(root, {
  signedIn: true,
  available: params.get("off") !== "1",
  dictationSupported: params.get("mic") === "1",
  startOpen: params.get("open") === "1",
  storage: { getItem() { return null; }, setItem() {} },
  synth: window.__synth,
  Utterance: FakeUtterance,
  getVoices: () => window.__voices,
  ask(question) {
    const q = question.toLowerCase();
    if (q.includes("add a note")) {
      return { ok: true, enabled: true, knowledge: "placeholder", reply: "Here's what I'll change. Nothing is saved until you tap Confirm.", proposal: { id: "hp_demo", title: "Add a note", lines: ["Job: 12 Ironbark Street", "Note: spoil pile is clear"] } };
    }
    if (q.includes("ironbark")) {
      return { ok: true, enabled: true, knowledge: "placeholder", reply: "G'day Sam. You're on spoil removal at 12 Ironbark Street on Wednesday 12 November 2026. Travel is 12.5 km. Gate code 2468. I can't see prices on your login." };
    }
    return { ok: true, enabled: true, knowledge: "placeholder", reply: "No worries. Helper only looks things up. I can't create a job or send anything. If your login shows New Job, that's the screen for it. I won't invent the taps." };
  },
  confirm() { window.__writes += 1; return { reply: "Saved. That change is in CallUp now." }; },
  cancel() { return { reply: "Cancelled. Nothing was changed." }; },
});
document.body.dataset.ready = "1";
</script>
</body>
</html>
